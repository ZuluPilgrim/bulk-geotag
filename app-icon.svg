<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfdbfe"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
    <clipPath id="photo">
      <rect x="196" y="312" width="560" height="440" rx="28"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0b1f4d" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App tile -->
  <rect x="32" y="32" width="960" height="960" rx="210" fill="url(#bg)"/>

  <!-- Second photo behind (the "bulk" stack) -->
  <rect x="236" y="262" width="560" height="440" rx="36" fill="#ffffff" opacity="0.45" transform="rotate(-6 516 482)"/>

  <!-- Main photo: white frame + landscape -->
  <g filter="url(#shadow)">
    <rect x="172" y="288" width="608" height="488" rx="44" fill="#ffffff"/>
  </g>
  <g clip-path="url(#photo)">
    <rect x="196" y="312" width="560" height="440" fill="url(#sky)"/>
    <circle cx="640" cy="420" r="52" fill="#fbbf24"/>
    <path d="M196 752 L380 520 L470 630 L560 540 L756 752 Z" fill="#16a34a"/>
    <path d="M196 752 L380 520 L430 584 L330 752 Z" fill="#15803d"/>
  </g>

  <!-- Map pin -->
  <g filter="url(#shadow)">
    <path d="M736 196
             C 640 196 566 270 566 362
             C 566 482 736 640 736 640
             C 736 640 906 482 906 362
             C 906 270 832 196 736 196 Z"
          fill="#e11d48" stroke="#ffffff" stroke-width="22"/>
    <circle cx="736" cy="360" r="58" fill="#ffffff"/>
  </g>
</svg>
