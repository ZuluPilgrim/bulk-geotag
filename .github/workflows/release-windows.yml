# Builds the Windows installers (.msi and setup .exe) on GitHub's Windows runners
# and attaches them to the GitHub Release for the tag.
#
# Runs automatically when a tag starting with "v" is pushed (e.g. v1.3),
# or manually: Actions tab → "Release (Windows)" → Run workflow → enter an existing tag.
name: Release (Windows)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach to (e.g. v1.2-packaged)"
        required: true

permissions:
  contents: write # needed to create/update the release and upload assets

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out the tagged code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      # tauri.conf.json lists the Linux formats, so ask for the Windows ones explicitly.
      - name: Build installers and upload to the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles msi,nsis
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "Bulk GeoTag __VERSION__"
          releaseBody: "See CHANGELOG.md for what's included."
          releaseDraft: false
          prerelease: false

      # GitHub turns the space in "Bulk GeoTag" into a dot; rename to match the Linux packages.
      - name: Rename Windows assets (Bulk.GeoTag_* -> bulk-geotag_*)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            -q '.assets[] | select(.name | startswith("Bulk.GeoTag_")) | "\(.apiUrl) \(.name)"' |
          while read -r url name; do
            new="bulk-geotag_${name#Bulk.GeoTag_}"
            gh api -X PATCH "${url#https://api.github.com/}" -f name="$new" -q .name
          done
